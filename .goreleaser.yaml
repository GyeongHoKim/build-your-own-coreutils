# Release configuration for the Windows distribution of the utilities.
# Every utility ships in one bundle, gcoreutils, and each binary carries a
# "g" prefix so it does not collide with Windows built-ins such as tree.com.
version: 2

project_name: gcoreutils

builds:
  - &windows
    id: gtouch
    main: ./cmd/touch
    binary: gtouch
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [windows]
    goarch: [amd64, arm64]
  - <<: *windows
    id: gtree
    main: ./cmd/tree
    binary: gtree

archives:
  - formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - src: cmd/touch/README.md
        dst: docs/touch.md

checksum:
  name_template: checksums.txt

# release-please creates the GitHub release and its notes from CHANGELOG.md;
# GoReleaser only attaches the archives to it.
release:
  mode: keep-existing
  prerelease: auto

changelog:
  disable: true

scoops:
  - repository:
      owner: GyeongHoKim
      name: scoop-bucket
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: bucket
    homepage: https://github.com/GyeongHoKim/build-your-own-coreutils
    description: Unix-style utilities written in Go (gtouch, gtree)
    license: MIT
    skip_upload: auto
