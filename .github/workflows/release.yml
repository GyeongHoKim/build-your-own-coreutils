name: Release

# release-please keeps a release PR open that bumps the version from
# Conventional Commits and updates CHANGELOG.md. Merging that PR tags the
# release, and the jobs below publish it.
on:
  push:
    branches: [main]

# Never cancel a release that is already publishing.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

  # Tags created with the default token do not trigger other workflows, so
  # the release is checked and published here rather than on a tag push.
  ci:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    uses: ./.github/workflows/ci.yml

  goreleaser:
    needs: [release-please, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The default token cannot push to other repositories, so the Scoop
          # bucket needs a token with write access to GyeongHoKim/scoop-bucket.
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

  # Run the published binaries on Windows to catch packaging mistakes that
  # the unit tests cannot see, such as a missing or misnamed executable.
  smoke:
    needs: [release-please, goreleaser]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: amd64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Download release archive
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern "*_windows_${{ matrix.arch }}.zip" --pattern checksums.txt
      - name: Verify checksum
        run: |
          $zip = Get-ChildItem *.zip | Select-Object -First 1
          $want = (Select-String -Path checksums.txt -SimpleMatch $zip.Name).Line.Split(' ')[0]
          $got = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $want) { throw "checksum mismatch for $($zip.Name)" }
          Expand-Archive $zip -DestinationPath pkg
      - name: Run binaries
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          .\pkg\gtouch.exe new.txt
          if (-not (Test-Path new.txt)) { throw "gtouch did not create new.txt" }
          .\pkg\gtree.exe pkg
