name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these checks before publishing.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@v4
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15
          install-only: true
      # The justfile runs Unix recipes with zsh, which Ubuntu runners lack.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      # Formatting does not depend on the OS, so one runner checks it.
      - name: Check formatting
        if: runner.os == 'Linux'
        run: |
          just fmt
          git diff --exit-code
      - name: Lint
        run: just lint
      - name: Check release configuration
        if: runner.os == 'Linux'
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Build
        run: just build
      - name: Test
        run: just test
